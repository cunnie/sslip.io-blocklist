name: Update Blocklist from Takedown Notice

on:
  repository_dispatch:
    types: [takedown]

permissions:
  contents: write

concurrency:
  group: takedown
  cancel-in-progress: false

jobs:
  block-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate, append, and sort blocklist.txt
        env:
          IP_ADDR: ${{ github.event.client_payload.ip }}
          TARGET: ${{ github.event.client_payload.target }}
          EMAIL_SUBJECT: ${{ github.event.client_payload.subject }}
          EMAIL_FROM: ${{ github.event.client_payload.from }}
          TZ: America/Los_Angeles
        run: |
          # IP_ADDR holds one or more space-separated IP addresses
          CLEAN_TARGET=$(printf '%s' "$TARGET" | tr -d '\r\n\t' | sed 's/[^[:print:]]//g')

          # Make sure appended lines don't join the file's last line
          [ -n "$(tail -c1 blocklist.txt)" ] && echo >> blocklist.txt

          ADDED=()
          VALID=0
          for IP in $IP_ADDR; do
            # Validate IP format (IPv4 or IPv6)
            if [[ ! "$IP" =~ ^[0-9a-fA-F.:]+$ ]]; then
              echo "Skipping invalid IP format: $IP"
              continue
            fi
            VALID=$((VALID + 1))

            # Skip IPs already in blocklist.txt (including ones added in this run)
            if grep -qE "^${IP//./\\.}(\s|#|$)" blocklist.txt; then
              echo "IP $IP already exists in blocklist.txt; skipping."
              continue
            fi

            echo "${IP} # ${CLEAN_TARGET}" >> blocklist.txt
            ADDED+=("$IP")
          done

          if [ ${#ADDED[@]} -eq 0 ]; then
            git checkout -- blocklist.txt
            if [ "$VALID" -eq 0 ]; then
              echo "No valid IPs in payload: $IP_ADDR"
              exit 1
            fi
            echo "Nothing new to add; taking no action."
            exit 0
          fi

          # Preserve lines 1-17, sort lines 18+ with standard ASCII sort
          {
            head -n 17 blocklist.txt
            tail -n +18 blocklist.txt | grep -v '^[[:space:]]*$' | LC_ALL=C sort
          } > blocklist.txt.tmp && mv blocklist.txt.tmp blocklist.txt

          git config user.name "Abuse Bot"
          git config user.email "abuse@nip.io"
          git add blocklist.txt
          git commit -m "$EMAIL_SUBJECT" -m "From: $EMAIL_FROM"
          git push
